spring.application.name=user-service

# ===============================
# PostgreSQL connection
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/logdata
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===============================
# Hibernate JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Server
# ===============================
server.port=8781
server.address=0.0.0.0   # make sure app is reachable inside Docker network

# ===============================
# JWT
# ===============================
jwt.secret=thisIsMysecregtfrdesww233eggtffeeddgkjjhhtdhttebd54ndhdhfhhhshs8877465sbbdd2
jwt.expiration=3600000

# ===============================
# Logging
# ===============================
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG

# ===============================
# Swagger/OpenAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =========================
